services:
  mongo:
    image: mongo:7.0.22
    container_name: clearml-mongo
    restart: unless-stopped
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
      - clearml-mongo-data:/data/db
      - clearml-mongo-config:/data/configdb
    networks:
      - clearml-network

  redis:
    image: redis:7-alpine
    container_name: clearml-redis
    restart: unless-stopped
    networks:
      - clearml-network

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: clearml-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - clearml-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - clearml-network

  fileserver:
    image: clearml/server:latest
    container_name: clearml-fileserver
    restart: unless-stopped
    command: ["fileserver"]
    environment:
      CLEARML__fileserver__delete__allow_batch: "true"
    volumes:
      - clearml-fileserver-data:/mnt/fileserver
    ports:
      - "8081:8081"
    depends_on:
      - mongo
      - redis
      - elasticsearch
    networks:
      - clearml-network

  apiserver:
    image: clearml/server:latest
    container_name: clearml-apiserver
    restart: unless-stopped
    command: ["apiserver"]
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      CLEARML__apiserver__pre_populate__enabled: "true"
    ports:
      - "8008:8008"
    depends_on:
      - mongo
      - redis
      - elasticsearch
      - fileserver
    networks:
      - clearml-network

  webserver:
    image: clearml/server:latest
    container_name: clearml-webserver
    restart: unless-stopped
    command: ["webserver"]
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      CLEARML_API_HOST: apiserver
      CLEARML_API_PORT: 8008
      CLEARML_FILES_HOST: fileserver
      CLEARML_FILES_PORT: 8081
    ports:
      - "8080:8080"
    depends_on:
      apiserver:
        condition: service_started
      mongo:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - clearml-network

volumes:
  clearml-mongo-data:
  clearml-mongo-config:
  clearml-elasticsearch-data:
  clearml-fileserver-data:

networks:
  clearml-network:
    driver: bridge
